name: CI

# The loop's own gate. `CLAUDE.md` has said "run it before and after any change to
# spawn.sh" since the suite existed, and nothing checked that anyone did: this repo had no
# workflow at all, so every PR merged on the author's word that the cases still passed.
#
# `verify` runs the offline suites and a syntax pass. They need no network (one exception:
# the floor page's browser step fetches a browser if the runner has none), no secrets
# and no services — `bin/test-spawn.sh` stubs every external command (claude, gh, board.py,
# worktree.sh) and `bin/test-notify.py` never opens a socket — so this job can run anywhere
# and must be given nothing.
#
# WHERE it runs follows riffmap's split (its ci.yml, card #407): PR code is code any branch
# can write, so it never runs on a box that holds credentials. Here that rules out exactly
# one box — the `agents` LXC this repo deploys to, which holds the bot's GitHub login and a
# Claude subscription token. The repo variable `CI_RUNNER` picks the runner: since
# September 28, 2026 it is `watcher-ci`, a runner on the `ci` LXC (108) registered to THIS
# repo — Steve's lab, not GitHub's metered minutes. A runner registered to another repo
# (`riffmap-ci`) never picks up this repo's jobs, because repos in a user account cannot
# share runners: pointing at it queues every check forever. Unset the variable to fall back
# to GitHub-hosted if the ci box is down. Never set it to the agents box.
#
# Deploying is NOT here and should not be. A deploy job would need a runner on the agents
# box, which is exactly the box PR code must never reach. Instead this job's result is the
# first thing the box's own deployer reads (deploy/autodeploy.sh): it ships a main commit
# only when `verify` passed on it, then only when every lane is idle. CI decides whether a
# commit may ship; the box decides when.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseding an in-flight PR check is fine; a push to main is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # A syntax error in any of these is a broken box, not a failed test: spawn.sh is what
      # systemd runs, and install.sh, autodeploy.sh and rollout.sh are what put it there.
      - name: Shell syntax
        run: |
          for f in bin/spawn.sh bin/shim/claude bin/worktree.sh bin/detect.sh bin/doctor.sh bin/tail.sh bin/hygiene.sh bin/eval.sh bin/receipt-check.sh bin/test-spawn.sh bin/test-deploy.sh bin/test-detect.sh bin/test-tail.sh bin/test-eval-ledger.sh bin/test-receipt.sh bin/test-add-project.sh deploy/install.sh deploy/rollout.sh deploy/autodeploy.sh deploy/add-project.sh deploy/bootstrap.sh evals/cases/*.sh; do
            bash -n "$f" && echo "ok  $f"
          done

      - name: The spawner suite
        run: bash bin/test-spawn.sh

      - name: The deployer suite
        run: bash bin/test-deploy.sh

      - name: The add-project suite
        run: bash bin/test-add-project.sh

      - name: The detector suite
        run: bash bin/test-detect.sh

      - name: The replay suite's ledger
        run: bash bin/test-eval-ledger.sh

      - name: The Discord suite
        run: python3 bin/test-notify.py

      - name: The metrics suite
        run: python3 bin/test-metrics.py

      - name: The board suite
        run: python3 bin/test-board.py

      - name: The floor page suite
        run: python3 bin/test-floor.py

      # The floor page is a program that runs in a browser, and until October 1, 2026 no
      # step here ever ran it: "The floor page suite" above checks the Python that builds
      # the page's data, and looks for strings in the page's source. #70 merged a page
      # whose script did not parse, with that suite green. This step loads the page in
      # headless Chrome and clicks it. It needs a browser binary: the ci box has one in
      # the runner's Playwright cache (riffmap's CI puts it there) and a GitHub-hosted
      # runner has Chrome on the PATH; if neither is there, fetch one rather than skip —
      # a check that skips when its tool is missing is a check nobody decided to remove.
      - name: A browser for the floor page
        run: |
          python3 -c "import sys; sys.path.insert(0, 'bin'); import browse; b = browse.find_browser(); print(b or 'none found'); sys.exit(0 if b else 1)" \
            || npx --yes playwright install chromium-headless-shell

      - name: The floor page, in a real browser
        run: python3 bin/test-floor-browser.py

      - name: The lane-tail suite
        run: bash bin/test-tail.sh

      - name: The review-receipt suite
        run: bash bin/test-receipt.sh

  # Card #142: a code PR used to merge on the tick's own say-so that `reviewer` ran — CI
  # had no way to see whether it actually had, or whether the branch was amended after.
  # This job is the independent half: it never trusts the tick, only the PR's own comments
  # and its own current head commit. It runs as its own job (not a `verify` step) so it
  # reports as its own named check, becomes a required check in branch protection
  # alongside `verify` (a repo setting — Settings → Branches — not something this file can
  # set for itself), and evaluates fresh on every push: an amend with no new receipt is a
  # fresh run with nothing to find, so it reports red on its own, no tick involved.
  #
  # It runs independently of `verify`, not after it, and finishes in seconds — reading a
  # few PR comments, nothing it builds or tests — so on an ordinary push it concludes
  # (red: no receipt posted yet) long before `verify` does. `commands/watch.md` §3 is what
  # turns it green: once `reviewer` posts its receipt comment, the tick reruns this job
  # (`gh run rerun --failed`) against the same commit and waits for it again. A docs-only
  # PR that touches no part of the merge gate is exempt — `bin/receipt-check.sh` says so
  # itself and exits 0 on the first run, never red at all.
  review-receipt:
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    # `contents: read` above is the whole workflow's default; this job also needs to read
    # the PR's own files and comments — reviewer findings here, confirmed against a real
    # run on PR #148 (roloc/watcher): without this, every `gh pr view`/`gh api .../comments`
    # call in bin/receipt-check.sh is denied ("Resource not accessible by integration"),
    # which reads as "no clean receipt" for every PR, forever, never as the access error it
    # actually is.
    permissions:
      contents: read
      pull-requests: read
      issues: read
    env:
      # bin/floor.py is this repo's one screen (card #142, reviewer findings) — without
      # this, a change to it would never need the `🤖 usability:` receipt the script
      # otherwise supports.
      RECEIPT_SCREEN_PATHS: bin/floor.py
    steps:
      - uses: actions/checkout@v4
      - name: A reviewer receipt for this exact commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash bin/receipt-check.sh "${{ github.event.pull_request.number }}"
